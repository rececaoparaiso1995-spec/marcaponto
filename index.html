<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Ajusta connect-src ao URL do teu Worker -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob:; connect-src https://*.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer"><title>Ponto</title>
<style>body{font:16px system-ui;max-width:760px;margin:auto;padding:12px;color:#222}input,button{font:inherit;padding:8px;margin:3px 0}form{display:grid;gap:4px;max-width:320px}
button{cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center}table{width:100%;border-collapse:collapse}td{border-bottom:1px solid #ddd;padding:4px}
.big{font-size:1.2em;padding:14px 20px}.nav{display:flex;gap:12px;align-items:center;justify-content:center}.g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.g>b{text-align:center;font-size:.8em}.d{min-height:62px;border:1px solid #ccc;border-radius:4px;padding:2px;font-size:.75em;overflow:hidden}.d small{display:block}
.T{background:#d8f3dc}.F{background:#e5e5e5}.V{background:#cfe3ff}.X{background:#ffd0d0}.J{background:#fff0b8}.now{outline:2px solid #333}
.ph{position:fixed;inset:0;margin:auto;max-width:95vw;max-height:95vh;background:#000;border:4px solid #fff;z-index:9}</style></head>
<body><div id="app"></div><script src="app.js"></script></body></html>
